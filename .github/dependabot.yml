version: 2
updates:
  # npm 依赖：每周一次，minor/patch 合并成一个 PR，major 单独 PR，限制 5 个未合并 PR
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
